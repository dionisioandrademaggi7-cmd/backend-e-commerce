<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — Harmonização de Milhões</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#0B1F3A; --navy-mid:#112B52; --gold:#C8993A; --gold-light:#E2BF78; --white:#FDFCFA; --text-light:#8A9AB5; --radius:8px; }
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Outfit',sans-serif; background:var(--navy); color:var(--white); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
        body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 80% 60% at 20% 10%, rgba(200,153,58,0.08) 0%, transparent 60%); pointer-events:none; }
        .card { position:relative; background:rgba(17,43,82,0.7); border:1px solid rgba(200,153,58,0.2); border-radius:16px; padding:48px 44px; width:100%; max-width:460px; backdrop-filter:blur(12px); box-shadow:0 32px 80px rgba(0,0,0,0.4); animation:fadeUp 0.5s ease both; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(24px);} to{opacity:1;transform:translateY(0);} }
        .logo { font-family:'Playfair Display',serif; font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin-bottom:32px; }
        h1 { font-family:'Playfair Display',serif; font-size:28px; font-weight:600; line-height:1.25; margin-bottom:10px; }
        .subtitle { font-size:14px; color:var(--text-light); line-height:1.6; margin-bottom:32px; }
        .field { margin-bottom:18px; }
        label { display:block; font-size:12px; font-weight:500; letter-spacing:0.8px; text-transform:uppercase; color:var(--text-light); margin-bottom:8px; }
        input { width:100%; background:rgba(11,31,58,0.6); border:1px solid rgba(200,153,58,0.2); border-radius:var(--radius); color:var(--white); font-family:'Outfit',sans-serif; font-size:15px; padding:13px 16px; outline:none; transition:border-color 0.2s, box-shadow 0.2s; }
        input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(200,153,58,0.12); }
        .btn { width:100%; margin-top:8px; padding:15px; background:linear-gradient(135deg,#C8993A,#A87A20); color:var(--navy); font-family:'Outfit',sans-serif; font-size:15px; font-weight:700; border:none; border-radius:var(--radius); cursor:pointer; transition:opacity 0.2s, transform 0.15s; }
        .btn:hover { opacity:0.92; transform:translateY(-1px); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .erro { background:rgba(220,60,60,0.12); border:1px solid rgba(220,60,60,0.3); border-radius:var(--radius); color:#ff7a7a; font-size:13px; padding:12px 14px; margin-bottom:18px; display:none; }
        .footer-link { text-align:center; margin-top:20px; font-size:13px; color:var(--text-light); }
        .footer-link a { color:var(--gold); text-decoration:none; }
        .footer-link a:hover { text-decoration:underline; }
        .back-link {
            position:absolute; top:24px; right:24px;
            display:flex; align-items:center; gap:5px;
            font-size:12.5px; color:var(--text-light); text-decoration:none;
            transition:color 0.2s; z-index:10;
        }
        .back-link:hover { color:var(--gold-light); }
        @media (max-width:480px) {
            .back-link { top:18px; right:18px; font-size:12px; }
            .back-link svg { width:12px; height:12px; }
        }
    </style>
</head>
<body>
<div class="card">
    <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar
    </a>
    <div class="logo">Dr. Marco Maggi</div>
    <h1>Criar conta</h1>
    <p class="subtitle">Cria a tua conta para aceder ao conteúdo após a compra.</p>
    <div class="erro" id="erro"></div>
    <div class="field">
        <label>Nome completo</label>
        <input type="text" id="nome" placeholder="O teu nome" autocomplete="name">
    </div>
    <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="o.teu@email.com" autocomplete="email">
    </div>
    <div class="field">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="field" style="margin-bottom:12px;">
        <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;line-height:1.6;">
            <input type="checkbox" id="consentimento" style="width:16px;height:16px;margin-top:2px;flex-shrink:0;accent-color:var(--gold);cursor:pointer;">
            <span style="color:var(--text-light);">Li e aceito a <a href="/privacidade" style="color:var(--gold);text-decoration:none;">Política de Privacidade</a>. Concordo com o tratamento dos meus dados pessoais para criação de conta e acesso ao conteúdo adquirido.</span>
        </label>
    </div>
    <button class="btn" id="btn" onclick="registar()">Criar conta →</button>
    <div class="footer-link">Já tens conta? <a href="/login">Entra aqui</a></div>
</div>
<script>
    // Se já está logado, redireciona imediatamente
    fetch('/api/eu').then(r => r.json()).then(u => {
        if (u.logado) {
            window.location.href = u.pagou ? '/produto' : '/sem-acesso';
        }
    }).catch(() => {});

    const destino = new URLSearchParams(location.search).get('destino') || '';

    async function registar() {
        const nome  = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value;
        const erro  = document.getElementById('erro');
        const btn   = document.getElementById('btn');
        const consentimento = document.getElementById('consentimento').checked;
        erro.style.display = 'none';

        if (!nome || !email || !senha) {
            erro.textContent = 'Preenche todos os campos.';
            erro.style.display = 'block'; return;
        }

        if (!consentimento) {
            erro.textContent = 'Tens de aceitar a Política de Privacidade para criar conta.';
            erro.style.display = 'block'; return;
        }

        btn.disabled = true; btn.textContent = 'A criar conta…';

        try {
            const res  = await fetch('/api/registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.erro);

            if (destino === 'comprar') {
                const r = await fetch('/api/checkout', { method: 'POST' });
                const d = await r.json();
                if (d.url) { window.location.href = d.url; return; }
            }

            window.location.href = data.pagou ? '/produto' : '/sem-acesso';
        } catch (err) {
            erro.textContent = err.message;
            erro.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Criar conta →';
        }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') registar(); });
</script>
</body>
</html>
